# freedv-embedded configuration.
# Copy to /etc/freedv-embedded/freedv-embedded.toml and edit.
# Check it with: freedv-embedded -c <file> --check-config
# Unknown keys are errors.

[log]
level = "info"         # "debug", "info", "warn" or "error"; also applies to the FreeDV backend

[modem]
mode = "RADEV1"        # only RADEV1 for now
callsign = ""          # sent at the end of each over; empty = not sent
start_mode = "digital" # "digital" or "analog": the mode after start-up

# Switches between digital and analog (transparent) mode. In analog mode the
# modem is bypassed: microphone audio goes straight to the radio while PTT is
# pressed, radio audio goes straight to the headset otherwise.
# The mode changes only while receiving.
[mode_switch]
type = "none"          # "none", "gpio" or "console" (the "a" key toggles)
# chip = "/dev/gpiochip0"
# line = 22
# active_low = true
# bias = "pull-up"
# debounce_ms = 20
# action = "toggle"    # "toggle": push button, each press changes the mode
                       # "level": latching switch, active = analog

[audio]
period_ms = 20         # audio block size
prebuffer_ms = 160     # playback buffering after a gap; raise it if audio is choppy

# The sound card wired to the radio.
# List devices with "aplay -L" and "arecord -L". Use the "plughw:" names:
# ALSA then converts to mono 16 bit at the sample rate below when the card
# does not support that itself.
[audio.radio]
type = "alsa"          # "alsa", or "null" to run without hardware
capture_device = "plughw:CARD=Device,DEV=0"
playback_device = "plughw:CARD=Device,DEV=0"
sample_rate = 48000

# The sound card wired to the headphones and microphone.
[audio.headset]
type = "alsa"
capture_device = "plughw:CARD=Device_1,DEV=0"
playback_device = "plughw:CARD=Device_1,DEV=0"
sample_rate = 48000

# PTT in: what tells the modem to transmit.
[ptt.input]
type = "gpio"          # "gpio", "console" or "none" (receive only)
                       # "console": the space bar toggles transmit, for bench tests in a terminal
chip = "/dev/gpiochip0"  # see "gpioinfo"; on a Pi 5 the header may be gpiochip4, depending on the kernel
line = 17              # BCM number, not the header pin number
active_low = true      # button to ground
bias = "pull-up"       # "none", "pull-up", "pull-down"
debounce_ms = 20

# PTT out: how the radio is keyed.
[ptt.output]
type = "none"          # "none" = the radio keys itself (sound card VOX), or "gpio"
# chip = "/dev/gpiochip0"
# line = 27
# active_low = false
tx_delay_ms = 0        # wait between keying the radio and starting the modem signal
tx_tail_ms = 150       # keep the radio keyed this long after the last sample is queued

[display]
type = "console"       # "console" (status line on stderr), "ssd1306", "none",
                       # or several: type = ["ssd1306", "console"]
refresh_ms = 250

# For "ssd1306": a 128x64 OLED on I2C. Enable I2C with raspi-config and find
# the address with "i2cdetect -y 1".
# i2c_device = "/dev/i2c-1"
# i2c_address = 0x3C
# rotate = false       # true turns the picture 180 degrees
# contrast = 207       # 0 to 255
